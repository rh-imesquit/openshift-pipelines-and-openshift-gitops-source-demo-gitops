#config-file

# este arquivo pode ser utilizado como modelo para criação de outras aplicações. 
# Os templates contidos na pasta templates podem ser customizados de acordo com cada aplicação.
namespace: apps-dev

app:
  name: quarkus-api-consulta-cep
  deploymentName: quarkus-api-consulta-cep
  deploymentConfigMatch: "quarkus-api-consulta-cep" 
  version: "v1" 
  persistentVolumeClaim: 
    enabled: false

configmap:
  enabled: false
  items:
    - name: quarkus-api-consulta-cep-config
      filePath: "files/application.properties"
      fileName: application.properties

# secrets:
#   - name: quarkus-api-consulta-cep-secrets
#     keys:
#       - name: EXAMPLE_DB_PASS
#         encoded: false
#         value: "admin"

replicaCount: 1

image:
  nameVersion: image-registry.openshift-image-registry.svc:5000/apps-dev/quarkus-api-consulta-cep:1.0.0
  pullPolicy: Always

imagePullSecrets: []
nameOverride: "quarkus-api-consulta-cep"

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

ports:
  - containerPort: 8080

